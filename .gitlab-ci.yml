# The Seed - GitLab CI/CD Pipeline
# Simple, working pipeline configuration

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_VERSION: "3.11"

cache:
  paths:
    - .cache/pip
    - .pytest_cache/

# Verification helper functions
.verify_tool: &verify_tool |
  verify_tool() {
    local tool_name="$1"
    local install_hint="${2:-}"
    echo "Verifying tool: $tool_name"
    echo "Current PATH: $PATH"
    if ! command -v "$tool_name" &> /dev/null; then
      echo "❌ ERROR: '$tool_name' not found in PATH"
      if [ -n "$install_hint" ]; then
        echo "   Hint: $install_hint"
      fi
      echo "   Available commands in PATH:"
      compgen -c | grep -i "$(echo $tool_name | cut -d'-' -f1)" || echo "   (none found)"
      return 1
    fi
    echo "✓ '$tool_name' found at: $(command -v $tool_name)"
    return 0
  }

.verify_python_module: &verify_python_module |
  verify_python_module() {
    local module_name="$1"
    echo "Verifying Python module: $module_name"
    echo "Python executable: $(which python)"
    echo "Python version: $(python --version)"
    echo "Python sys.path:"
    python -c "import sys; print('\n'.join(sys.path))"
    if ! python -c "import $module_name" 2>/dev/null; then
      echo "❌ ERROR: Python module '$module_name' is not importable"
      echo "   Installed packages:"
      python -m pip list | grep -i "$module_name" || echo "   (module not found in pip list)"
      return 1
    fi
    echo "✓ Python module '$module_name' is importable"
    return 0
  }

stages:
  - validate
  - test
  - deploy

# Quick validation - <30 seconds (AUTOMATIC)
basic-validation:
  stage: validate
  image: python:3.11-slim
  script:
    - echo "Basic Validation"
    - echo "=================="
    - python --version
    - python -m pip --version
    - echo "Validation complete"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

# Linting - fast checks (AUTOMATIC)
linting:
  stage: validate
  image: python:3.11-slim
  script:
    - pip install black ruff
    - cd warbler-cda-package
    - echo "Running Black formatter check..."
    - black --check warbler_cda/ || echo "Black formatting issues found (non-blocking)"
    - echo "Running Ruff linter..."
    - ruff check warbler_cda/ || echo "Ruff issues found (non-blocking)"
    - echo "✓ Linting complete"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true

# Story test - MANUAL
story-test:
  stage: validate
  image: python:3.11
  before_script:
    - *verify_python_module
  script:
    - echo "Story Test Validation"
    - echo "======================"
    - if [ -f "scripts/story_test.py" ]; then python -m pip install pyyaml && verify_python_module yaml && python scripts/story_test.py; else echo "Story test script not found - skipping"; fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true

# Warbler CDA tests - MANUAL (heavy, 15+ minutes)
warbler-cda-tests:
  stage: test
  image: python:3.11
  tags:
    - saas-linux-medium-amd64
  before_script:
    - *verify_python_module
  script:
    - echo "Warbler CDA Tests"
    - echo "================="
    - python -m pip install --upgrade pip
    - cd warbler-cda-package
    - python -m pip install --no-cache-dir -e ".[dev]" || python -m pip install --no-cache-dir -e .
    - python -m pip install --no-cache-dir pytest pytest-cov
    - python -m pytest tests/ -v --tb=short --junitxml=test-results.xml --cov=warbler_cda --cov-report=term --cov-report=xml
    - echo "✓ All tests passed!"
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      junit: warbler-cda-package/test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: warbler-cda-package/coverage.xml
    paths:
      - warbler-cda-package/coverage.xml
      - warbler-cda-package/test-results.xml
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: false

# Pack verification - MANUAL
pack-verification:
  stage: test
  image: python:3.11
  tags:
    - saas-linux-medium-amd64
  script:
    - echo "Pack Verification"
    - echo "================="
    - python -m pip install --upgrade pip
    - cd warbler-cda-package
    - python -m pip install --no-cache-dir -e .
    - |
      python3 << 'EOF'
      from warbler_cda.pack_loader import PackLoader
      pl = PackLoader()
      docs = pl.discover_documents()
      print(f"Found {len(docs)} documents")
      exit(0)
      EOF
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true

# Deploy to the HuggingFace Space
deploy-huggingface:
  stage: deploy
  image: python:3.11
  before_script:
    - *verify_tool
    - *verify_python_module
  script:
    - echo "Deploying Warbler CDA to HuggingFace"
    - echo "====================================="
    - python -m pip install --upgrade pip
    - python -m pip install huggingface_hub
    - verify_python_module huggingface_hub
    - cd warbler-cda-package
    - |
      # Check if HF_TOKEN is set
      if [ -z "$HF_TOKEN" ]; then
        echo "⚠️  HF_TOKEN not set - skipping deployment"
        echo "To enable deployment, set HF_TOKEN in GitLab CI/CD variables"
        exit 0
      fi
    - |
      # Configure git credential helper
      echo "Configuring git credentials..."
      git config --global credential.helper store
      echo "https://user:${HF_TOKEN}@huggingface.co" > ~/.git-credentials
      chmod 600 ~/.git-credentials
    - |
      # Login to HuggingFace
      echo "Logging in to HuggingFace..."
      hf auth login --token $HF_TOKEN --add-to-git-credential
    - |
      # Upload to Space
      echo "Syncing to HuggingFace Space..."
      SPACE_NAME="${HF_SPACE_NAME:-Bellok/warbler-cda}"
      
      # Upload all files to existing Space
      hf upload $SPACE_NAME . . --repo-type=space
    - echo "✓ Deployment complete!"
    - echo "🌐 Space URL - https://huggingface.co/spaces/$SPACE_NAME"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success  # Auto-deploy on tags
    - if: '$CI_COMMIT_TAG'
      when: on_success  # Auto-deploy on tags
  allow_failure: true
  environment:
    name: huggingface-space
    url: https://huggingface.co/spaces/${HF_SPACE_NAME:-Bellok/warbler-cda}
