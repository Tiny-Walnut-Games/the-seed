apiVersion: v1
kind: Service
metadata:
  name: warbler-cda-service
  namespace: warbler-cda
  labels:
    app: warbler-cda
spec:
  selector:
    app: warbler-cda
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  type: ClusterIP  # Use LoadBalancer or NodePort if you need external access without Ingress
